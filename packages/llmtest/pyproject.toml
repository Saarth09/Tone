[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmtest"
version = "0.1.0"
description = "pytest for AI behavior — semantic regression tests for LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.24",
  "sentence-transformers>=2.2",
]

[project.scripts]
llmtest = "llmtest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
